<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>DASW - Tienda online</title>

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://use.fontawesome.com/releases/v5.1.1/css/all.css">

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <!-- Barra de navegacion -->

    <nav class="navbar navbar-dark bg-dark">

        <a class="navbar-brand" href="home.html">
            DASW
        </a>

        <form id="searchForm"
              class="form-inline flex-grow-1 mx-md-3">

            <input id="searchInput"
                   class="form-control mr-2"
                   type="search"
                   placeholder="Encuentra de todo"
                   aria-label="Buscar productos">

            <button class="btn btn-outline-light"
                    type="submit">
                Buscar
            </button>

        </form>

        <div class="d-flex align-items-center">

            <span class="text-light mr-3">
                Mi cuenta: Ana
            </span>

            <a id="cartLink"
               class="btn btn-outline-light"
               href="shopping-cart.html">

                <i class="fas fa-shopping-cart"></i>

                Carrito

                <span id="cartCount"
                      class="badge badge-light">
                    0
                </span>

            </a>

        </div>

    </nav>

    <!-- Banner comercial -->

    <section class="store-banner">

        <div class="container">

            <span class="banner-label">
                PRODUCTOS DE CALIDAD
            </span>

            <h1>Del campo a tu mesa</h1>

            <p>
                Descubre nuestra selección de frutas
                y productos mexicanos.
            </p>

            <a href="#mainList" class="btn btn-light">
                Explorar productos
            </a>

        </div>

    </section>

    <!-- Catalogo de productos -->

    <main class="container py-4">

        <h2 class="text-center mb-4">
            Nuestros productos
        </h2>

        <!-- Mensajes de confirmacion y errores -->

        <div id="message"
             role="status"
             aria-live="polite"
             hidden>
        </div>

        <!-- Estado de carga del catalogo -->

        <div id="catalogStatus"
             class="text-center my-3"
             role="status">
        </div>

        <!-- Productos generados mediante JavaScript -->

        <div id="mainList" class="row">
        </div>

        <!-- Paginacion -->

        <nav id="paginationContainer"
             class="d-flex justify-content-center align-items-center my-4"
             aria-label="Paginación">

            <button id="prevPage"
                    class="btn btn-outline-primary"
                    type="button"
                    disabled>
                Anterior
            </button>

            <span id="pageInfo" class="mx-3">
                Página 1
            </span>

            <button id="nextPage"
                    class="btn btn-outline-primary"
                    type="button"
                    disabled>
                Siguiente
            </button>

        </nav>

    </main>

    <!-- Modal para agregar productos al carrito -->

    <div class="modal fade"
         id="quantityModal"
         tabindex="-1"
         role="dialog"
         aria-labelledby="modalTitle"
         aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered"
             role="document">

            <div class="modal-content">

                <!-- Cabecera del modal -->

                <div class="modal-header">

                    <h5 class="modal-title" id="modalTitle">
                        Agregar al carrito
                    </h5>

                    <button type="button"
                            class="close"
                            data-dismiss="modal"
                            aria-label="Cerrar">
                        &times;
                    </button>

                </div>

                <!-- Formulario de cantidad -->

                <form id="quantityForm" novalidate>

                    <div class="modal-body">

                        <img id="modalImage"
                             class="modal-product-image"
                             src="images/placeholder.svg"
                             alt="Producto seleccionado">

                        <h5 id="modalProductName"
                            class="mt-3">
                        </h5>

                        <p id="modalPrice"></p>

                        <p id="modalStock"
                           class="text-muted">
                        </p>

                        <div class="form-group">

                            <label for="quantityInput">
                                Cantidad
                            </label>

                            <input id="quantityInput"
                                   class="form-control"
                                   type="number"
                                   min="1"
                                   step="1"
                                   value="1"
                                   required>

                        </div>

                        <!-- Errores de validacion -->

                        <div id="modalError"
                             class="text-danger"
                             role="alert">
                        </div>

                    </div>

                    <!-- Botones del modal -->

                    <div class="modal-footer">

                        <button type="button"
                                class="btn btn-secondary"
                                data-dismiss="modal">
                            Cancelar
                        </button>

                        <button id="confirmAdd"
                                type="submit"
                                class="btn btn-primary">
                            Agregar
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <!-- Pie de pagina -->

    <footer class="bg-dark text-light text-center py-3">

        DASW | Práctica 4 - E-commerce

    </footer>

    <!-- Dependencias de Bootstrap -->

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

    <!-- JavaScript del catalogo -->

    <script type="module" src="js/catalog.js"></script>

</body>

</html>
